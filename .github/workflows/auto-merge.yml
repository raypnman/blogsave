name: Approve and merge owner PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_ID: ${{ github.event.repository.id }}
      OWNER_ID: ${{ github.repository_owner_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REQUIRED_JOBS: '["validate"]'
    steps:
      - name: Approve and merge the tested commit
        shell: bash
        run: |
          set -euo pipefail

          # Use API metadata only. This privileged job never checks out PR code.
          run_id=$(jq -er '.workflow_run.id' "$GITHUB_EVENT_PATH")
          sha=$(jq -er '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
          number=$(jq -r '.workflow_run.pull_requests
            | if length == 1 then .[0].number else empty end' "$GITHUB_EVENT_PATH")
          if [[ ! "$number" =~ ^[0-9]+$ || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No unambiguous pull request for this CI run."
            exit 0
          fi

          endpoint="repos/$GITHUB_REPOSITORY/pulls/$number"
          if ! gh api "$endpoint" | jq -e --arg sha "$sha" --arg branch "$DEFAULT_BRANCH" \
            --argjson repo "$REPO_ID" --argjson owner "$OWNER_ID" '
              .state == "open" and (.draft | not) and .user.id == $owner
              and .head.repo.id == $repo and .head.sha == $sha
              and .base.repo.id == $repo and .base.ref == $branch
            ' >/dev/null; then
            echo "PR is ineligible or its head changed since CI."
            exit 0
          fi

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" |
            jq -e --argjson required "$REQUIRED_JOBS" '
              [.[].jobs[] | select(.conclusion == "success") | .name] as $passed
              | ($required - $passed) == []
            ' >/dev/null

          if ! review_error=$(gh api --method POST "$endpoint/reviews" -f event=APPROVE \
            -f commit_id="$sha" -f body="Required CI jobs passed for this commit." 2>&1); then
            if [[ "$review_error" != *"GitHub Actions is not permitted to create or approve pull requests"* &&
                  "$review_error" != *"GitHub Actions is not permitted to approve pull requests"* ]]; then
              printf '%s\n' "$review_error" >&2
              exit 1
            fi
            echo "Actions approval is disabled. GitHub will enforce any required reviews on merge."
          fi

          gh api --method PUT "$endpoint/merge" -f sha="$sha" \
            -f merge_method=squash --jq '.merged' | jq -e '. == true' >/dev/null
